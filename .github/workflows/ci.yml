name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install:electron
      - run: npm run check
      - run: npm test
      - name: Linux desktop tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:ui
      - name: Windows desktop tests
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            test-results/
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
